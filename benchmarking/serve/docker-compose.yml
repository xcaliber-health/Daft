# Containerized benchmark environment: object store, REST catalog, and the
# query server, for compute-near-data runs where the client has no storage
# access.
#
#   docker compose -f benchmarking/serve/docker-compose.yml up -d
#
# The server image is built from the repository root:
#   docker build -f deploy/Dockerfile.serve -t daft-serve:dev .

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/warehouse || true
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"

  daft-serve:
    image: daft-serve:dev
    depends_on:
      - iceberg-rest
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9494"
      - "--config"
      - "/etc/daft/serve.yaml"
    environment:
      DAFT_SERVE_TOKEN: bench
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ./serve-config.yaml:/etc/daft/serve.yaml:ro
    ports:
      - "9494:9494"
